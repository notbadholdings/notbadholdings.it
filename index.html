<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Bad Holdings</title>

<!-- GitHub Pages serves static files only, so it cannot issue a server-side
     301. These three lines are the redirect: canonical consolidates search
     engines onto the target, meta refresh moves browsers with JS disabled,
     and location.replace moves everyone else without adding a history entry. -->
<link rel="canonical" href="https://notbadholdings.com/">
<meta http-equiv="refresh" content="0; url=https://notbadholdings.com/">

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111112">
<link rel="icon" href="assets/icon-128.png" type="image/png" sizes="128x128">

<style>
  html, body { height: 100%; margin: 0; background: #111112; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 400 13px/1.6 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.06em; color: #7C7C76; padding: 24px; text-align: center;
  }
  a { color: #D6FF3D; text-decoration: none; border-bottom: 1px solid rgb(214 255 61 / 0.4); }
  a:hover { border-bottom-color: #D6FF3D; }
</style>
</head>
<body>
  <p>Redirecting to <a href="https://notbadholdings.com/">notbadholdings.com</a>&hellip;</p>
  <script>location.replace("https://notbadholdings.com/");</script>
</body>
</html>
